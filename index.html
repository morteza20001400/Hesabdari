<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<title>حسابداری پروژه</title></head><body>
<header><div><h1>حسابداری پروژه</h1><small>ثبت و مدیریت مالی</small></div></header>
<main>
<div class="cards">
<div class="card"><span>مانده نقدی</span><b id="cash">۰</b></div><div class="card"><span>درآمد</span><b id="incomeTotal">۰</b></div>
<div class="card"><span>هزینه</span><b id="expenseTotal">۰</b></div><div class="card"><span>مطالبات</span><b id="receivableTotal">۰</b></div>
</div>
<div class="quick"><button onclick="go('register')">➕ ثبت اطلاعات</button><button onclick="go('history')">📋 سوابق</button><button onclick="go('report')">📊 گزارش مالی</button><button onclick="backup()">💾 پشتیبان</button></div>

<section id="register"><h2>➕ ثبت اطلاعات جدید</h2>
<div class="grid">
<label>نوع عملیات<select id="type"><option value="income">درآمد</option><option value="expense">هزینه</option><option value="receipt">دریافت</option><option value="payment">پرداخت</option><option value="loan_in">دریافت وام</option><option value="loan_out">بازپرداخت وام</option><option value="receivable">ثبت طلب</option><option value="debt">ثبت بدهی</option><option value="farm">عملیات باغ / کشاورزی</option></select></label>
<label>پروژه<select id="project"><option value="">عمومی</option></select></label>
<label>مبلغ<input id="amount" type="number" inputmode="numeric" placeholder="مثلاً 5000000"></label>
<label>تاریخ<input id="date" type="date"></label>
<label>طرف حساب<input id="party" placeholder="اختیاری"></label><label>شرح<input id="desc" placeholder="مثلاً خرید کود"></label>
</div><button onclick="saveTx()">💾 ثبت اطلاعات</button><div id="msg"></div></section>

<section id="history"><h2>📋 سوابق ثبت‌شده</h2><div class="filters"><select id="filter" onchange="render()"><option value="">همه عملیات</option><option value="income">درآمد</option><option value="expense">هزینه</option><option value="receipt">دریافت</option><option value="payment">پرداخت</option><option value="loan_in">دریافت وام</option><option value="loan_out">بازپرداخت وام</option><option value="receivable">طلب</option><option value="debt">بدهی</option><option value="farm">باغ/کشاورزی</option></select><select id="filterProject" onchange="render()"><option value="">همه پروژه‌ها</option></select></div><div id="list"></div></section>

<section id="report"><h2>📊 گزارش مالی</h2><div id="reportBox"></div></section>
<section><h2>🏗️ پروژه‌ها</h2><div id="projects"></div><button onclick="addProject()">＋ پروژه جدید</button></section>
<section><h2>💾 پشتیبان‌گیری</h2><button onclick="backup()">⬇️ ذخیره پشتیبان</button><label class="restore">⬆️ بازیابی پشتیبان<input type="file" accept=".json" onchange="restore(event)"></label></section>
</main><footer>اطلاعات روی همین گوشی ذخیره می‌شود.</footer><script src="app.js"></script></body></html>
